name: Export Maisa Agent Configs

on:
  workflow_dispatch:
    inputs:
      workspace_name:
        description: "Workspace name for export path (agents/<workspace_name>/...)"
        required: true
      organization_id:
        description: "Organization ID in Maisa"
        required: true
      workspace_id:
        description: "Workspace ID in Maisa"
        required: true
      environment:
        description: "Environment key in MAISA_AUTH_CREDENTIAL JSON (e.g. dev, pre, pro)"
        required: true
      mode:
        description: "Export mode: all = exports all agents, single = exports one agent by id"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "single"
      worker_manager_id:
        description: "Worker Manager ID (only if mode=single)"
        required: false

  workflow_call:
    inputs:
      workspace_name:
        required: true
        type: string
      organization_id:
        required: true
        type: string
      workspace_id:
        required: true
        type: string
      environment:
        required: true
        type: string
      mode:
        required: false
        type: string
        default: "all"
      worker_manager_id:
        required: false
        type: string
    secrets:
      maisa_auth_credential:
        required: true

permissions:
  contents: write

jobs:
  export-agents:
    runs-on: base-runner

    steps:
      - name: Checkout export branch
        uses: actions/checkout@v4
        with:
          ref: feature/export-data
          fetch-depth: 0

      - name: Compute export timestamp
        id: ts
        shell: bash
        run: |
          echo "value=$(date -u +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Export agents to agents/<workspace>/<timestamp>
        env:
          MAISA_AUTH_CREDENTIAL: ${{ secrets.maisa_auth_credential || secrets.MAISA_AUTH_CREDENTIAL }}
          MAISA_ENVIRONMENT: ${{ inputs.environment }}
          ORGANIZATION_ID: ${{ inputs.organization_id }}
          WORKSPACE_ID: ${{ inputs.workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          MODE: ${{ inputs.mode }}
          WORKER_MANAGER_ID: ${{ inputs.worker_manager_id }}
          EXPORT_DIR: agents/${{ inputs.workspace_name }}/${{ steps.ts.outputs.value }}
        run: |
          python << 'EOF'
          import asyncio
          import json
          import os
          from dataclasses import dataclass
          from typing import Any, Optional, Dict, List
          from pathlib import Path
          import httpx

          TIMEOUT = 120

          def resolve_env(raw: str, environment: str):
              try:
                  creds = json.loads(raw)
                  env = creds.get(environment)
                  if not env:
                      available = ", ".join(sorted(creds.keys()))
                      raise SystemExit(f"❌ No config for environment '{environment}'. Available: {available}")
                  if isinstance(env, dict):
                      return env["url"], env["cookie"]
                  return "", str(env)
              except json.JSONDecodeError:
                  raise SystemExit("❌ MAISA_AUTH_CREDENTIAL is not valid JSON.")

          @dataclass
          class MaisaAPI:
              base_url: str
              cookie: str

              def _headers(self) -> Dict[str, str]:
                  return {
                      "Accept": "application/json",
                      "Content-Type": "application/json",
                      "User-Agent": "Mozilla/5.0 (compatible; MaisaExporter/1.0)",
                      "Cookie": self.cookie,
                  }

              async def _request(self, method: str, path: str, *, params: Optional[Dict[str, Any]] = None) -> Any:
                  url = f"{self.base_url.rstrip('/')}{path}"
                  while True:
                      async with httpx.AsyncClient(timeout=TIMEOUT, verify=False, follow_redirects=True) as client:
                          kwargs: Dict[str, Any] = {"headers": self._headers()}
                          if params:
                              kwargs["params"] = params
                          qs = "&".join(f"{k}={v}" for k, v in (params or {}).items())
                          full_url = f"{url}?{qs}" if qs else url
                          curl_parts = [f"curl -k -X {method} '{full_url}'"]
                          for h_name, h_val in self._headers().items():
                              safe_val = h_val[:40] + "...[MASKED]" if h_name.lower() == "cookie" else h_val
                              curl_parts.append(f"  -H '{h_name}: {safe_val}'")
                          print("🌐 Equivalent curl:\n" + " \\\n".join(curl_parts))
                          resp = await client.request(method, url, **kwargs)
                          if resp.status_code == 429:
                              print("  ⏳ Rate limited, waiting 2s...")
                              await asyncio.sleep(2)
                              continue
                          if resp.status_code >= 400:
                              raise Exception(f"HTTP {resp.status_code}: {resp.text[:500]}")
                          if not resp.content:
                              return None
                          return resp.json()

              async def get(self, path: str, **kw: Any) -> Any:
                  return await self._request("GET", path, **kw)

              async def get_paginated(self, path: str, *, page_size: int = 100) -> List[Dict[str, Any]]:
                  items: List[Dict[str, Any]] = []
                  page = 1
                  while True:
                      resp = await self.get(path, params={"limit": page_size, "page": page})
                      if isinstance(resp, dict):
                          page_items = resp.get("data", [])
                          if isinstance(page_items, dict):
                              page_items = page_items.get("items", page_items.get("workerManagers", []))
                          elif not isinstance(page_items, list):
                              page_items = []
                      else:
                          page_items = []
                      if not page_items:
                          break
                      items.extend(page_items)
                      pagination = resp.get("pagination", {}) if isinstance(resp, dict) else {}
                      if not pagination.get("hasNextPage", False):
                          break
                      page += 1
                  return items

          def safe_slug(s: str) -> str:
              keep = []
              for ch in (s or ""):
                  if ch.isalnum() or ch in ("-", "_", "."):
                      keep.append(ch)
                  elif ch.isspace():
                      keep.append("_")
              return "".join(keep).strip("._-") or "agent"

          async def main():
              environment = os.environ["MAISA_ENVIRONMENT"].strip()
              source_url, cookie = resolve_env(os.environ["MAISA_AUTH_CREDENTIAL"], environment)
              org_id = os.environ["ORGANIZATION_ID"].strip()
              workspace_id = os.environ["WORKSPACE_ID"].strip()
              mode = os.environ.get("MODE", "all").strip()
              worker_manager_id = os.environ.get("WORKER_MANAGER_ID", "").strip()
              export_dir = Path(os.environ["EXPORT_DIR"])

              if mode not in ("all", "single"):
                  raise SystemExit(f"❌ Invalid mode: {mode}")
              if mode == "single" and not worker_manager_id:
                  raise SystemExit("❌ mode=single but WORKER_MANAGER_ID is missing")

              print(f"🌍 Environment:     {environment}")
              print(f"🔧 Maisa URL:       {source_url}")
              print(f"📁 Organization ID: {org_id}")
              print(f"📁 Workspace ID:    {workspace_id}")
              print(f"📦 Export mode:     {mode}")

              api = MaisaAPI(base_url=source_url, cookie=cookie)

              if mode == "single":
                  print(f"\n🤖 Fetching single worker manager: {worker_manager_id}")
                  resp = await api.get(f"/maisa-bff/worker-manager/{worker_manager_id}")
                  wm = resp.get("data", resp) if isinstance(resp, dict) else resp
                  worker_managers = [wm] if wm else []
              else:
                  print(f"\n🤖 Fetching all worker managers from workspace...")
                  worker_managers = await api.get_paginated(
                      f"/maisa-bff/organizations/{org_id}/workspaces/{workspace_id}/worker-managers"
                  )

              if not worker_managers:
                  raise SystemExit("❌ No worker managers found")

              print(f"✅ Found {len(worker_managers)} worker manager(s):")
              for wm in worker_managers:
                  print(f"  - {wm.get('name', 'N/A')} ({wm.get('id', 'N/A')}) [{wm.get('status', 'N/A')}]")

              export_dir.mkdir(parents=True, exist_ok=True)
              exported_count = 0
              failed_count = 0

              for wm in worker_managers:
                  wm_id = wm.get("id", wm.get("_id", ""))
                  wm_name = wm.get("name", "unnamed")
                  wm_status = wm.get("status", "unknown")
                  print(f"\n  📥 Exporting {wm_name} ({wm_id}) [{wm_status}] ...")
                  try:
                      resp = await api.get(f"/maisa-bff/worker-manager/{wm_id}")
                      full_wm = resp.get("data", resp) if isinstance(resp, dict) else resp
                      filename = f"{safe_slug(wm_name)}__{wm_status}__{wm_id}.json"
                      out_path = export_dir / filename
                      content = json.dumps(full_wm, indent=2, ensure_ascii=False) + "\n"
                      out_path.write_text(content, encoding="utf-8")
                      print(f"    ✅ Wrote {out_path} ({len(content)} chars)")
                      exported_count += 1
                  except Exception as e:
                      error_msg = str(e)
                      if "403" in error_msg or "PERMISSION_DENIED" in error_msg:
                          print(f"    ⚠️  Skipped (no permissions)")
                      elif "401" in error_msg:
                          print(f"    ⚠️  Skipped (authentication failed)")
                      else:
                          print(f"    ❌ Error: {error_msg[:100]}")
                      failed_count += 1

              print(f"\n✅ Export completed! {exported_count} exported, {failed_count} failed/skipped")
              print(f"📁 Files written to: {export_dir}")

          asyncio.run(main())
          EOF

      - name: Commit & push exports
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "agents/${{ inputs.workspace_name }}"

          if git diff --cached --quiet; then
            echo "ℹ️  No changes to commit."
            exit 0
          fi

          git commit -m "chore(maisa): export agent configs to agents/${{ inputs.workspace_name }}/${{ steps.ts.outputs.value }} (run ${{ github.run_id }})"
          git push origin HEAD:feature/export-data
