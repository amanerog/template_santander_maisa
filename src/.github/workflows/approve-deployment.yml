name: Approve Maisa Deployment

# Manual approval for deployments to pro. A pending "Import Maisa Agents" run waits for a run of
# this workflow, launched by someone listed in .github/pro-approvers.txt who is not the requester.
# Find deploy_run_id in the URL of the waiting run: .../actions/runs/<deploy_run_id>

run-name: approval-${{ inputs.deploy_run_id }}-${{ inputs.decision }}

on:
  workflow_dispatch:
    inputs:
      deploy_run_id:
        description: "Run ID of the pending deployment (number at the end of its URL)"
        required: true
      decision:
        description: "approve or reject the deployment"
        required: true
        type: choice
        options:
          - "approve"
          - "reject"

permissions:
  contents: read
  actions: read

jobs:
  approve:
    name: Register decision
    runs-on: base-runner

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Validate approver and target run
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.deploy_run_id }}
          APPROVER: ${{ github.actor }}
        run: |
          set -euo pipefail

          if [[ ! "$DEPLOY_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "❌ deploy_run_id must be a number."
            exit 1
          fi

          APPROVERS="$(grep -vE '^[[:space:]]*(#|$)' .github/pro-approvers.txt | tr -d ' \r' | tr 'A-Z' 'a-z' || true)"
          if ! grep -qxF "$(tr 'A-Z' 'a-z' <<< "$APPROVER")" <<< "$APPROVERS"; then
            echo "❌ $APPROVER is not listed in .github/pro-approvers.txt."
            exit 1
          fi

          RUN="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$DEPLOY_RUN_ID")"
          STATUS="$(jq -r '.status' <<< "$RUN")"
          REQUESTER="$(jq -r '.actor.login' <<< "$RUN")"

          if [ "$STATUS" = "completed" ]; then
            echo "❌ Run $DEPLOY_RUN_ID has already finished."
            exit 1
          fi
          if [ "$(tr 'A-Z' 'a-z' <<< "$REQUESTER")" = "$(tr 'A-Z' 'a-z' <<< "$APPROVER")" ]; then
            echo "❌ $APPROVER launched run $DEPLOY_RUN_ID and cannot approve it."
            exit 1
          fi

          echo "✅ Decision '${{ inputs.decision }}' registered by $APPROVER for run $DEPLOY_RUN_ID (requested by $REQUESTER)."
