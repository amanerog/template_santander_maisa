name: Deploy PRO

# Step 2 of deploying a release to pro. Runs when a deployment request created by
# request-pro-deployment.yml is merged into the default branch. The approval is the pull request:
# it is only accepted if GitHub itself reports the PR as approved under the branch rules (which require
# a code owner review, so a merge that bypassed them is rejected) and the approval is on the final commit
# of a merged PR that added exactly one deployments/pro/*.json.

on:
  push:
    branches:
      - development
    paths:
      - "deployments/pro/**"

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: maisa-deploy-pro
  cancel-in-progress: false

jobs:
  verify-approval:
    name: Verify pull request approval
    runs-on: base-runner
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release_tag: ${{ steps.verify.outputs.release_tag }}
      target_organization_id: ${{ steps.verify.outputs.target_organization_id }}
      target_workspace_id: ${{ steps.verify.outputs.target_workspace_id }}
      import_mode: ${{ steps.verify.outputs.import_mode }}
      target_wm_id: ${{ steps.verify.outputs.target_wm_id }}
      request_id: ${{ steps.verify.outputs.request_id }}

    steps:
      - name: Checkout merged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify approval and read request
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REPO="$GITHUB_REPOSITORY"

          fail() { echo "❌ $*"; exit 1; }
          lower() { tr 'A-Z' 'a-z'; }

          [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || fail "Only the default branch can deploy to pro."

          PRS="$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls")"
          PR_NUMBER="$(jq -r --arg base "$DEFAULT_BRANCH" \
            '[.[] | select(.merged_at != null and .base.ref == $base)] | first | .number // empty' <<< "$PRS")"
          [ -n "$PR_NUMBER" ] || fail "Commit $GITHUB_SHA was not merged through a pull request."

          PR="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          AUTHOR="$(jq -r '.user.login' <<< "$PR" | lower)"
          HEAD_SHA="$(jq -r '.head.sha' <<< "$PR")"
          echo "🔎 Pull request #$PR_NUMBER by $AUTHOR (head $HEAD_SHA)"

          # The PR must add exactly one deployment request and nothing else.
          FILES="$(gh api "repos/$REPO/pulls/$PR_NUMBER/files" --paginate --jq '.[] | [.status, .filename] | @tsv')"
          [ "$(wc -l <<< "$FILES" | tr -d ' ')" = "1" ] || fail "The PR must change exactly one file. Changed:
          $FILES"
          STATUS="$(cut -f1 <<< "$FILES")"
          FILE="$(cut -f2 <<< "$FILES")"
          [ "$STATUS" = "added" ] || fail "Deployment requests can only be added, not $STATUS ($FILE)."
          [[ "$FILE" =~ ^deployments/pro/[A-Za-z0-9._-]+\.json$ ]] || fail "Unexpected file in PR: $FILE"

          # GitHub's own verdict on the PR under the branch rules (code owner review required).
          # APPROVED only when the required reviewers approved; a bypassed merge or an approval from
          # someone who is not a code owner leaves it as REVIEW_REQUIRED (or null if no rule applies).
          # shellcheck disable=SC2016
          PRDATA="$(gh api graphql -f owner="${REPO%%/*}" -f repo="${REPO#*/}" -F pr="$PR_NUMBER" -f query='
            query($owner: String!, $repo: String!, $pr: Int!) {
              repository(owner: $owner, name: $repo) {
                pullRequest(number: $pr) {
                  reviewDecision
                  reviews(first: 100) {
                    nodes { state submittedAt author { login } commit { oid } }
                  }
                }
              }
            }' --jq '.data.repository.pullRequest')"

          DECISION="$(jq -r '.reviewDecision // "NONE"' <<< "$PRDATA")"
          echo "📋 reviewDecision: $DECISION"
          [ "$DECISION" = "APPROVED" ] || fail "GitHub reports reviewDecision=$DECISION for PR #$PR_NUMBER. It must be APPROVED by the required code owner review (a merge that bypassed the rules is not accepted)."

          # Latest decisive review of each reviewer; all of them must be on the final commit.
          LATEST="$(jq -r --arg head "$HEAD_SHA" '
            .reviews.nodes
            | map(select(.author != null and (.state == "APPROVED" or .state == "CHANGES_REQUESTED" or .state == "DISMISSED")))
            | group_by(.author.login | ascii_downcase)
            | map(sort_by(.submittedAt) | last)
            | .[] | [(.author.login | ascii_downcase), .state, ((.commit.oid == $head) | tostring)] | @tsv' <<< "$PRDATA")"

          APPROVED_BY=""
          while IFS=$'\t' read -r login state current; do
            [ -z "$login" ] && continue
            [ "$login" = "$AUTHOR" ] && continue
            [ "$state" = "CHANGES_REQUESTED" ] && fail "$login requested changes on PR #$PR_NUMBER."
            if [ "$state" = "APPROVED" ]; then
              [ "$current" = "true" ] || fail "The approval of $login is not on the final commit of PR #$PR_NUMBER. Ask for a new approval."
              APPROVED_BY="$login"
            fi
          done <<< "$LATEST"

          [ -n "$APPROVED_BY" ] || fail "PR #$PR_NUMBER has no approval (other than its author's) on its final commit."
          echo "✅ Approved by $APPROVED_BY (requested by $AUTHOR)"

          # Read and validate the request.
          REQ="$(cat "$FILE")"
          TAG="$(jq -r '.release_tag // empty' <<< "$REQ")"
          ORG_ID="$(jq -r '.target_organization_id // empty' <<< "$REQ")"
          WS_ID="$(jq -r '.target_workspace_id // empty' <<< "$REQ")"
          MODE="$(jq -r '.import_mode // empty' <<< "$REQ")"
          WM_ID="$(jq -r '.target_wm_id // empty' <<< "$REQ")"

          [[ "$TAG" =~ ^agent-[a-z0-9]+(-[a-z0-9]+)*-[0-9]{8}-[0-9]{6}$ ]] || fail "Invalid release_tag in $FILE."
          [[ "$ORG_ID" =~ ^[A-Za-z0-9_-]+$ ]] || fail "Invalid target_organization_id in $FILE."
          [[ "$WS_ID" =~ ^[A-Za-z0-9_-]+$ ]] || fail "Invalid target_workspace_id in $FILE."
          [ "$MODE" = "new_worker" ] || [ "$MODE" = "new_version" ] || fail "Invalid import_mode in $FILE."
          [[ "$WM_ID" =~ ^[A-Za-z0-9_-]*$ ]] || fail "Invalid target_wm_id in $FILE."
          if [ "$MODE" = "new_version" ] && [ -z "$WM_ID" ]; then fail "import_mode=new_version requires target_wm_id."; fi

          # A request can be deployed only once (blocks "Re-run all jobs" on a finished run).
          REQUEST_ID="$(basename "$FILE" .json)"
          ASSETS="$(gh release view "$TAG" --repo "$REPO" --json assets --jq '.assets[].name')"
          if grep -qx "deployed-pro-$REQUEST_ID.txt" <<< "$ASSETS"; then
            fail "Request $REQUEST_ID was already deployed. Create a new request to deploy again."
          fi

          {
            echo "request_id=$REQUEST_ID"
            echo "release_tag=$TAG"
            echo "target_organization_id=$ORG_ID"
            echo "target_workspace_id=$WS_ID"
            echo "import_mode=$MODE"
            echo "target_wm_id=$WM_ID"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Deploying \`$TAG\` to pro"
            echo "- Pull request: #$PR_NUMBER (requested by \`$AUTHOR\`)"
            echo "- Approved by: \`$APPROVED_BY\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy ${{ needs.verify-approval.outputs.release_tag }} to pro
    needs: verify-approval
    uses: ./.github/workflows/import-agents.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ needs.verify-approval.outputs.release_tag }}
      target_organization_id: ${{ needs.verify-approval.outputs.target_organization_id }}
      target_workspace_id: ${{ needs.verify-approval.outputs.target_workspace_id }}
      environment: pro
      import_mode: ${{ needs.verify-approval.outputs.import_mode }}
      target_wm_id: ${{ needs.verify-approval.outputs.target_wm_id }}
    secrets:
      maisa_auth_credential: ${{ secrets.MAISA_AUTH_CREDENTIAL }}

  mark-done:
    name: Mark request as deployed
    needs: [verify-approval, deploy]
    runs-on: base-runner
    permissions:
      contents: write
    steps:
      - name: Upload marker to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify-approval.outputs.release_tag }}
          REQUEST_ID: ${{ needs.verify-approval.outputs.request_id }}
        run: |
          set -euo pipefail
          MARKER="$RUNNER_TEMP/deployed-pro-$REQUEST_ID.txt"
          {
            echo "request=$REQUEST_ID"
            echo "tag=$TAG"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > "$MARKER"
          gh release upload "$TAG" "$MARKER" --repo "$GITHUB_REPOSITORY" --clobber
