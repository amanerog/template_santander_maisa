name: Import Maisa Agents

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target Maisa URL (e.g. https://gppaas-maisa-plat.sgtech.pre.corp)"
        required: true
      workspace_name:
        description: "Workspace SOURCE in Git (folder agents/<workspace_name>/...)"
        required: true
      target_organization_id:
        description: "Target Maisa organization ID"
        required: true
      target_workspace_id:
        description: "Target Maisa workspace ID"
        required: true
      snapshot:
        description: "Snapshot folder (YYYYMMDD-HHMMSS). Empty = latest"
        required: false
      mode:
        description: "all = import all agents, single = import one by id"
        required: false
        default: "all"
        type: choice
        options:
          - "all"
          - "single"
      agent_id:
        description: "Agent id (only if mode=single). It's the wm_id part of the .mai filename"
        required: false
      import_mode:
        description: "new_worker = new worker in workspace; new_version = new version of existing worker"
        required: false
        default: "new_worker"
        type: choice
        options:
          - "new_worker"
          - "new_version"
      target_wm_id:
        description: "Worker Manager ID to create a new version of (only if import_mode=new_version)"
        required: false
      skip_import:
        description: "Skip import and test an already-deployed agent instead"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      test_wm_id:
        description: "Worker Manager ID to test directly (required when skip_import=true)"
        required: false

  workflow_call:
    inputs:
      target_url:
        required: true
        type: string
      workspace_name:
        required: true
        type: string
      target_organization_id:
        required: true
        type: string
      target_workspace_id:
        required: true
        type: string
      snapshot:
        required: false
        type: string
      mode:
        required: false
        type: string
        default: "all"
      agent_id:
        required: false
        type: string
      import_mode:
        required: false
        type: string
        default: "new_worker"
      target_wm_id:
        required: false
        type: string
      skip_import:
        required: false
        type: string
        default: "false"
      test_wm_id:
        required: false
        type: string
    secrets:
      maisa_auth_credential:
        required: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # JOB 1: QA gate — runs qa-test.py without credentials (must print OK)
  # ---------------------------------------------------------------------------
  qa-test:
    name: QA gate (pre-check)
    runs-on: base-runner

    steps:
      - name: Checkout development branch (read scripts)
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 1

      - name: Run QA test script (must print OK)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "scripts/qa-test.py" ]; then
            echo "❌ scripts/qa-test.py not found. Failing pipeline."
            exit 1
          fi

          echo "✅ QA test script found. Running pre-check (no credentials)..."
          OUT="$(python scripts/qa-test.py | tee /dev/stderr)"

          if ! echo "$OUT" | grep -q "OK"; then
            echo "❌ qa-test.py did not print OK. Failing workflow."
            exit 1
          fi

          echo "✅ QA pre-check passed"

  # ---------------------------------------------------------------------------
  # JOB 2: Import agents from Git snapshot into Maisa
  # Skipped when skip_import=true.
  # ---------------------------------------------------------------------------
  import-agents:
    name: Import agents
    runs-on: base-runner
    needs: qa-test
    if: inputs.skip_import != 'true'
    outputs:
      imported_wm_id: ${{ steps.import.outputs.imported_wm_id }}

    steps:
      - name: Checkout export branch (read exports)
        uses: actions/checkout@v4
        with:
          ref: feature/export-data
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Import agents from Git snapshot
        id: import
        env:
          TARGET_MAISA_URL: ${{ inputs.target_url }}
          TARGET_MAISA_COOKIE: ${{ secrets.maisa_auth_credential || secrets.MAISA_AUTH_CREDENTIAL }}
          TARGET_ORGANIZATION_ID: ${{ inputs.target_organization_id }}
          TARGET_WORKSPACE_ID: ${{ inputs.target_workspace_id }}
          WORKSPACE_NAME: ${{ inputs.workspace_name }}
          SNAPSHOT: ${{ inputs.snapshot }}
          MODE: ${{ inputs.mode }}
          AGENT_ID: ${{ inputs.agent_id }}
          IMPORT_MODE: ${{ inputs.import_mode }}
          TARGET_WM_ID: ${{ inputs.target_wm_id }}
        run: |
          python << 'EOF'
          import asyncio
          import os
          from pathlib import Path
          from typing import Any, Dict, List
          import httpx

          TIMEOUT = 120

          def headers(cookie: str) -> Dict[str, str]:
              return {
                  "Cookie": cookie,
                  "User-Agent": "Mozilla/5.0 (compatible; MaisaImporter/1.0)",
              }

          def api_url(base_url: str, path: str) -> str:
              return f"{base_url.rstrip('/')}/maisa-bff{path}"

          def pick_snapshot_dir(base_dir: Path, snapshot: str) -> Path:
              if snapshot:
                  p = base_dir / snapshot
                  if not p.exists():
                      raise RuntimeError(f"Snapshot folder not found: {p}")
                  return p
              candidates = sorted(p for p in base_dir.iterdir() if p.is_dir())
              if not candidates:
                  raise RuntimeError(f"No snapshot folders found under {base_dir}")
              return candidates[-1]

          def filename_agent_id(p: Path) -> str:
              parts = p.stem.split("__")
              return parts[-1] if len(parts) >= 2 else p.stem

          def extract_wm_id(resp: Any) -> str:
              if not isinstance(resp, dict):
                  return ""
              data = resp.get("data", resp)
              if not isinstance(data, dict):
                  return ""
              return (
                  data.get("workerManagerId") or
                  data.get("id") or
                  data.get("workerId") or
                  ""
              )

          async def import_agent(
              base_url: str,
              cookie: str,
              org_id: str,
              ws_id: str,
              mai_path: Path,
              import_mode: str,
              target_wm_id: str,
          ) -> Any:
              file_bytes = mai_path.read_bytes()

              if import_mode == "new_version":
                  url = api_url(base_url, f"/workers/{target_wm_id}/import")
                  params = {"mode": "newVersion"}
                  form_data = {}
                  print(f"    📤 POST {url}?mode=newVersion")
              else:
                  url = api_url(base_url, f"/organizations/{org_id}/workspaces/{ws_id}/workers/import")
                  params = {}
                  form_data = {"workspaceId": ws_id}
                  print(f"    📤 POST {url}")

              print(f"       File: {mai_path.name} ({len(file_bytes)} bytes)")

              async with httpx.AsyncClient(timeout=TIMEOUT, verify=False, follow_redirects=True) as client:
                  resp = await client.post(
                      url,
                      headers=headers(cookie),
                      files={"file": (mai_path.name, file_bytes, "application/octet-stream")},
                      data=form_data,
                      params=params,
                  )
              if resp.status_code >= 400:
                  raise RuntimeError(f"HTTP {resp.status_code}: {resp.text[:300]}")
              return resp.json() if resp.content else None

          async def main():
              base_url     = os.environ["TARGET_MAISA_URL"].strip()
              cookie       = os.environ["TARGET_MAISA_COOKIE"]
              org_id       = os.environ["TARGET_ORGANIZATION_ID"].strip()
              ws_id        = os.environ["TARGET_WORKSPACE_ID"].strip()
              workspace    = os.environ["WORKSPACE_NAME"].strip()
              snapshot     = os.environ.get("SNAPSHOT", "").strip()
              mode         = os.environ.get("MODE", "all").strip()
              agent_id     = os.environ.get("AGENT_ID", "").strip()
              import_mode  = os.environ.get("IMPORT_MODE", "new_worker").strip()
              target_wm_id = os.environ.get("TARGET_WM_ID", "").strip()

              if mode not in ("all", "single"):
                  raise SystemExit(f"❌ Invalid mode: {mode}")
              if mode == "single" and not agent_id:
                  raise SystemExit("❌ mode=single requires agent_id")
              if import_mode not in ("new_worker", "new_version"):
                  raise SystemExit(f"❌ Invalid import_mode: {import_mode}")
              if import_mode == "new_version" and not target_wm_id:
                  raise SystemExit("❌ import_mode=new_version requires target_wm_id")

              base_dir = Path("agents") / workspace
              if not base_dir.exists():
                  raise SystemExit(f"❌ Workspace folder not found: {base_dir}")

              snapshot_dir = pick_snapshot_dir(base_dir, snapshot)
              files = sorted(snapshot_dir.glob("*.mai"))
              if mode == "single":
                  files = [p for p in files if filename_agent_id(p) == agent_id]
                  if not files:
                      raise SystemExit(f"❌ No .mai file found for agent_id={agent_id} in {snapshot_dir}")

              print("=" * 60)
              print("Maisa Agent Import")
              print("=" * 60)
              print(f"Target URL:    {base_url}")
              print(f"Org ID:        {org_id}")
              print(f"Workspace ID:  {ws_id}")
              print(f"Git folder:    {workspace}")
              print(f"Snapshot:      {snapshot_dir.name}")
              print(f"Mode:          {mode} / {import_mode}")
              print(f"Files:         {len(files)}")
              print("=" * 60)

              errors: List[str] = []
              last_wm_id = target_wm_id if import_mode == "new_version" else ""

              for p in files:
                  print(f"\n  File: {p.name}")
                  try:
                      resp = await import_agent(base_url, cookie, org_id, ws_id, p, import_mode, target_wm_id)
                      print(f"    📋 Response: {str(resp)[:300]}")

                      wm_id = extract_wm_id(resp) or last_wm_id
                      if wm_id:
                          last_wm_id = wm_id
                          print(f"    🤖 WM ID: {wm_id}")

                      print(f"    ✅ Done")
                  except Exception as e:
                      errors.append(f"{p.name}: {e}")
                      print(f"    ❌ {e}")

              print("\n" + "=" * 60)
              print(f"Imported: {len(files) - len(errors)}/{len(files)}")
              if errors:
                  for err in errors:
                      print(f"  ❌ {err}")
                  raise SystemExit(1)

              # Expose imported WM ID as job output for the QA step
              if last_wm_id:
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write(f"imported_wm_id={last_wm_id}\n")

          asyncio.run(main())
          EOF

  # ---------------------------------------------------------------------------
  # JOB 3: Post-import QA tests
  # Runs whether import-agents succeeded OR was skipped (skip_import=true).
  # TEST_WM_ID is resolved from: import output → target_wm_id → test_wm_id input
  # ---------------------------------------------------------------------------
  post-import:
    name: Post-import QA tests
    runs-on: base-runner
    needs: [qa-test, import-agents]
    if: |
      always() &&
      needs.qa-test.result == 'success' &&
      (needs.import-agents.result == 'success' || needs.import-agents.result == 'skipped')

    steps:
      - name: Checkout development branch (read scripts and dataset)
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      - name: Run QA tests
        env:
          TARGET_MAISA_URL: ${{ inputs.target_url }}
          MAISA_AUTH_CREDENTIAL: ${{ secrets.maisa_auth_credential || secrets.MAISA_AUTH_CREDENTIAL }}
          AUTH_TYPE: cookie
          ORGANIZATION_ID: ${{ inputs.target_organization_id }}
          WORKSPACE_ID: ${{ inputs.target_workspace_id }}
          # Priority: imported WM ID from job output → target_wm_id → test_wm_id input
          TEST_WM_ID: ${{ needs.import-agents.outputs.imported_wm_id || inputs.target_wm_id || inputs.test_wm_id }}
        shell: bash
        run: |
          if [ ! -f "scripts/qa-dataset.json" ]; then
            echo "❌ scripts/qa-dataset.json not found. Failing pipeline."
            exit 1
          fi
          echo "✅ Running QA tests (TEST_WM_ID=$TEST_WM_ID)..."
          python scripts/qa-test.py

      - name: Check if post-import script exists
        id: check-post-import
        shell: bash
        run: |
          if [ ! -f "scripts/post_import.py" ]; then
            echo "exists=false" >> $GITHUB_OUTPUT
          else
            echo "exists=true" >> $GITHUB_OUTPUT
          fi

      - name: Run post-import script
        if: steps.check-post-import.outputs.exists == 'true'
        env:
          TARGET_MAISA_URL: ${{ inputs.target_url }}
          MAISA_AUTH_CREDENTIAL: ${{ secrets.maisa_auth_credential || secrets.MAISA_AUTH_CREDENTIAL }}
          AUTH_TYPE: cookie
          ORGANIZATION_ID: ${{ inputs.target_organization_id }}
          WORKSPACE_ID: ${{ inputs.target_workspace_id }}
          TEST_WM_ID: ${{ needs.import-agents.outputs.imported_wm_id || inputs.target_wm_id || inputs.test_wm_id }}
        run: |
          python scripts/post_import.py
