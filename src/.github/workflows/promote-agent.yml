name: Promote Maisa Agent

# Publishes a release from dev (release-agent.yml) and deploys it to pre (import-agents.yml), where the
# QA tests run. The agent name comes from scripts/qa-dataset.json.
# To promote that same release to pro, run "Request PRO Deployment" with the release tag: it requires a
# successful pre deployment and an approved pull request.

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: "Worker version ID to export (lastVersionId from the worker manager)"
        required: true
      target_organization_id:
        description: "Target Maisa organization ID (pre)"
        required: true
      target_workspace_id:
        description: "Target Maisa workspace ID (pre)"
        required: true
      import_mode:
        description: "new_worker = new worker in workspace; new_version = new version of existing worker"
        required: false
        default: "new_worker"
        type: choice
        options:
          - "new_worker"
          - "new_version"
      target_wm_id:
        description: "Worker Manager ID to create a new version of (only if import_mode=new_version)"
        required: false

permissions:
  contents: write

concurrency:
  group: maisa-promote
  cancel-in-progress: false

jobs:
  prepare:
    name: Read agent name
    runs-on: base-runner
    outputs:
      agent_name: ${{ steps.name.outputs.agent_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Read agent name from qa-dataset.json
        id: name
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "scripts/qa-dataset.json" ]; then
            echo "❌ scripts/qa-dataset.json not found."
            exit 1
          fi

          NAME="$(jq -r '.agent_name // empty' scripts/qa-dataset.json)"
          SLUG="$(printf '%s' "$NAME" | tr 'A-Z' 'a-z' | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//')"

          if [ -z "$SLUG" ] || [ "$NAME" = "YOUR_WORKER_NAME_HERE" ]; then
            echo "❌ Set 'agent_name' in scripts/qa-dataset.json (found: '$NAME')."
            exit 1
          fi

          echo "🤖 Agent: $NAME -> $SLUG"
          echo "agent_name=$SLUG" >> "$GITHUB_OUTPUT"

  release:
    name: Release from dev
    needs: prepare
    uses: ./.github/workflows/release-agent.yml
    with:
      worker_id: ${{ inputs.worker_id }}
      agent_name: ${{ needs.prepare.outputs.agent_name }}
      environment: dev
    secrets:
      maisa_auth_credential: ${{ secrets.MAISA_AUTH_CREDENTIAL }}

  import:
    name: Deploy ${{ needs.release.outputs.release_tag }} to pre
    needs: release
    uses: ./.github/workflows/import-agents.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      target_organization_id: ${{ inputs.target_organization_id }}
      target_workspace_id: ${{ inputs.target_workspace_id }}
      environment: pre
      import_mode: ${{ inputs.import_mode }}
      target_wm_id: ${{ inputs.target_wm_id }}
    secrets:
      maisa_auth_credential: ${{ secrets.MAISA_AUTH_CREDENTIAL }}
