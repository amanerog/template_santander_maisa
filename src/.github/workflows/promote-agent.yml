name: Promote Maisa Agent

# Publishes a release from the source environment (release-agent.yml) and deploys it to pre
# (import-agents.yml). To promote that same release to pro, run "Import Maisa Agents" with the
# release tag and environment=pro: it requires a successful pre deployment and manual approval.

on:
  workflow_dispatch:
    inputs:
      worker_id:
        description: "Worker version ID to export (lastVersionId from the worker manager)"
        required: true
      agent_name:
        description: "Agent name used in the release tag (lowercase letters, digits and dashes)"
        required: true
      source_environment:
        description: "Source environment key in MAISA_AUTH_CREDENTIAL JSON (e.g. dev)"
        required: true
      target_organization_id:
        description: "Target Maisa organization ID (pre)"
        required: true
      target_workspace_id:
        description: "Target Maisa workspace ID (pre)"
        required: true
      import_mode:
        description: "new_worker = new worker in workspace; new_version = new version of existing worker"
        required: false
        default: "new_worker"
        type: choice
        options:
          - "new_worker"
          - "new_version"
      target_wm_id:
        description: "Worker Manager ID to create a new version of (only if import_mode=new_version)"
        required: false

permissions:
  contents: write

concurrency:
  group: maisa-promote-${{ inputs.agent_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Release from ${{ inputs.source_environment }}
    uses: ./.github/workflows/release-agent.yml
    with:
      worker_id: ${{ inputs.worker_id }}
      agent_name: ${{ inputs.agent_name }}
      environment: ${{ inputs.source_environment }}
    secrets:
      maisa_auth_credential: ${{ secrets.MAISA_AUTH_CREDENTIAL }}

  import:
    name: Deploy ${{ needs.release.outputs.release_tag }} to pre
    needs: release
    uses: ./.github/workflows/import-agents.yml
    with:
      release_tag: ${{ needs.release.outputs.release_tag }}
      target_organization_id: ${{ inputs.target_organization_id }}
      target_workspace_id: ${{ inputs.target_workspace_id }}
      environment: pre
      import_mode: ${{ inputs.import_mode }}
      target_wm_id: ${{ inputs.target_wm_id }}
    secrets:
      maisa_auth_credential: ${{ secrets.MAISA_AUTH_CREDENTIAL }}
